# 复制为 config.toml，根据本机实际后端修改。
listen = "127.0.0.1:8787"
# 任意正整数 N；实际容量取决于内存与模型后端。
concurrency = 3
queue_capacity = 24
# 可选：鉴权/请求体阶段入口容量；省略时自动计算。
# ingress_capacity = 64
stream_buffer_chunks = 8
metadata_queue_capacity = 4096
queue_timeout_seconds = 60
request_timeout_seconds = 180
max_body_bytes = 8388608
max_response_bytes = 16777216
database = ".liteinfer/state.sqlite3"
allow_remote = false

[[models]]
id = "local-model"
upstream_model = "local-model"
base_url = "http://127.0.0.1:8080/v1"
max_output_tokens = 1024
tools = false
vision = false
# 后端需要鉴权时填写环境变量名，不要填写密钥：
# api_key_env = "LOCAL_BACKEND_KEY"
# 仅当后端支持该参数时启用，按 API Key 隔离后端缓存：
# cache_isolation_parameter = "cache_salt"

# 复制 [[models]] 块即可注册更多模型，模型 ID 必须唯一。
