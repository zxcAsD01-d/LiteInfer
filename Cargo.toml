[package]
name = "liteinfer"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight local inference API for macOS with OpenAI and Anthropic protocols"
license = "Apache-2.0"
repository = "https://github.com/zxcAsD01-d/LiteInfer"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sysinfo = { version = "0.36.1", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["limit", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFNumber", "CFString", "CFDictionary"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["component"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
