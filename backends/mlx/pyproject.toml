[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liteinfer-mlx"
version = "1.0.0"
description = "Optional MLX inference optimizations for LiteInfer"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-MIT-legacy.txt", "LICENSE-PolyForm-Noncommercial-1.0.0-legacy.txt", "NOTICE-PolyForm-Noncommercial-1.0.0-legacy.txt", "liteinfer_mlx/QMM_MIT_NOTICE.txt"]
dependencies = ["mlx==0.32.4", "mlx-lm==0.32.2"]

[project.scripts]
liteinfer-mlx-batch = "liteinfer_mlx.cli:main"

[tool.setuptools.packages.find]
include = ["liteinfer_mlx*"]
