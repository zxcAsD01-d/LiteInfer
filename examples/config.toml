# 复制为 config.toml，根据本机实际后端修改。
listen = "127.0.0.1:8787"
# 任意正整数 N；实际容量取决于内存与模型后端。
concurrency = 3
queue_capacity = 24
# 可选：鉴权/请求体阶段入口容量；省略时自动计算。
# ingress_capacity = 64
stream_buffer_chunks = 8
metadata_queue_capacity = 4096
queue_timeout_seconds = 60
request_timeout_seconds = 180
max_body_bytes = 8388608
max_response_bytes = 16777216
database = ".liteinfer/state.sqlite3"
allow_remote = false

[[models]]
id = "qwen3.5-0.8b"
upstream_model = "Qwen3.5-0.8B-OptiQ-4bit"
base_url = "http://127.0.0.1:8081/v1"
max_output_tokens = 1024
tools = false
vision = false
context_length = 262144
# 后端需要鉴权时填写环境变量名，不要填写密钥：
# api_key_env = "LOCAL_BACKEND_KEY"
# 仅当后端支持该参数时启用，按 API Key 隔离后端缓存：
# cache_isolation_parameter = "cache_salt"

# 复制 [[models]] 块即可注册更多模型，模型 ID 必须唯一。

[mlx]
python = "python3" # 需 Python 3.11+；用于创建独立虚拟环境
directory = ".liteinfer/mlx"
task_timeout_seconds = 7200

[mlx.cache]
memory_max_entries = 64
memory_max_bytes = 2147483648
# SSD 默认关闭。设为 4294967296 可启用 4 GiB 二级缓存；会持久保存输入 token 与模型状态。
ssd_max_bytes = 0
ssd_max_entries = 512
ttl_seconds = 3600
min_tokens = 128
write_queue_entries = 2
write_queue_bytes = 268435456
